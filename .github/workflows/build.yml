name: KMP CI

on:
  push:
    branches: [ main, develop ]

  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]
    branches: [ main, develop ]


jobs:
  android:
    name: Android Build & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore secrets.properties
        run: echo '${{ secrets.IOS_LOCAL_SECRETS }}' > secrets.properties

      - name: Restore google-services.json
        run: echo '${{ secrets.FIREBASE_ANDROID_JSON }}' > composeApp/src/google-services.json

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Linters & Tests
        run: ./gradlew ktlintCheck detekt test

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Android build to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: ./gradlew appDistributionUploadDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: composeApp/build/outputs/apk/debug/*.apk


  ios:
    name: iOS Build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Restore secrets.properties
        run: echo '${{ secrets.IOS_LOCAL_SECRETS }}' > secrets.properties

      - name: Restore GoogleService-Info.plist
        run: echo '${{ secrets.FIREBASE_IOS_PLIST }}' > iosApp/iosApp/GoogleService-Info.plist

      - name: Build iOS app (Xcode drives Gradle)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            build

      #          xcodebuild \
      #          -project iosApp/iosApp.xcodeproj \
      #          -scheme iosApp \
      #          -configuration Debug \
      #          -archivePath build/iosApp.xcarchive \
      #          archive
      
      #          xcodebuild \
      #          -exportArchive \
      #          -archivePath build/iosApp.xcarchive \
      #          -exportOptionsPlist iosApp/iosApp/ExportOptions.plist \
      #          -exportPath build/ipa

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-build
          path: ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/*.app

